<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap');
      .logo-script {
        font-family: 'Great Vibes', 'Brush Script MT', cursive;
        font-size: 140px;
        fill: #0d0d0d;
        font-weight: normal;
      }
      .logo-sub {
        font-family: 'Montserrat', sans-serif;
        font-size: 38px;
        font-weight: 300;
        letter-spacing: 5px;
        fill: #111111;
      }
      .logo-path {
        stroke: #111111;
        stroke-width: 3.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Script Text "Ray" -->
  <text x="70" y="130" class="logo-script">Ray</text>
  
  <!-- Camera Shutter accent top right of y -->
  <path d="M 400 45 A 24 24 0 0 1 445 65" class="logo-path" stroke-width="4"/>
  <rect x="420" y="36" width="10" height="7" rx="1.5" fill="#111111" />
  
  <!-- Bottom Left Lens Corner Bracket -->
  <path d="M 30 190 L 30 220 L 70 220" class="logo-path" stroke-width="5"/>
  
  <!-- Bottom Text "Photography" -->
  <text x="45" y="200" class="logo-sub">Photography</text>
</svg>
